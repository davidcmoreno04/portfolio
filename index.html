<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio - Juan David Castellanos Moreno</title>
  
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .carousel-viewport {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .carousel-stage {
      width: 100%;
      height: 100%;
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .slide {
      min-width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ESTILO PARA EL PDF DE GOOGLE DRIVE */
    .slide iframe {
      width: 85%;
      height: 70vh; /* Ajustado para dar espacio al cuadro de texto inferior */
      border: none;
      background-color: #1a1a1a;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-top: -40px; /* Eleva el visor para balancear el diseño */
    }

    .caption-box {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 700px;
      background: rgba(17, 17, 17, 0.9);
      padding: 18px 25px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 10; /* Asegura que el texto quede por encima de cualquier elemento */
    }

    .caption-box h5 {
      margin: 0;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .caption-box p {
      margin: 6px 0 0 0;
      color: #a0a0a0;
      font-size: 13px;
      font-weight: 400;
    }

    /* BOTONES TOTALMENTE CIRCULARES EN HOVER */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      
      /* Tamaño fijo simétrico para evitar distorsión */
      width: 50px;
      height: 50px;
      border-radius: 50%;
      padding: 0;
      
      /* Centrado de la flecha interior */
      display: flex;
      align-items: center;
      justify-content: center;
      
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s ease;
      z-index: 20;
    }
    .nav-btn:hover { 
      background: rgba(255,255,255,0.2); 
      color: #ffffff;
    }
    .prev { left: 20px; }
    .next { right: 20px; }
  </style>
</head>
<body>

  <div class="carousel-viewport">
    <div class="carousel-stage" id="stage">
      
      <!-- SLIDE 1 -->
      <div class="slide">
        <!-- Se usa el enlace del documento con la terminación /preview -->
        <iframe src="https://google.com" allow="autoplay"></iframe>
        <div class="caption-box">
          <h5>Perfil Profesional</h5>
          <p>Juan David Castellanos Moreno — Comunicación Gráfica Publicitaria</p>
        </div>
      </div>

      <!-- SLIDE 2 -->
      <div class="slide">
        <!-- Si tienes una segunda página o un segundo archivo, cambia el ID aquí. Dejé el mismo de ejemplo -->
        <iframe src="https://google.com" allow="autoplay"></iframe>
        <div class="caption-box">
          <h5>Experiencia & Proyectos</h5>
          <p>Trayectoria en agencias, desarrollo de marcas y maquetación visual.</p>
        </div>
      </div>

    </div>

    <button class="nav-btn prev" onclick="moveSlide(-1)">❮</button>
    <button class="nav-btn next" onclick="moveSlide(1)">❯</button>
  </div>

  <script>
    let currentIdx = 0;
    const stage = document.getElementById('stage');
    const totalSlides = 2;

    function moveSlide(direction) {
      currentIdx = (currentIdx + direction + totalSlides) % totalSlides;
      stage.style.transform = `translateX(-${currentIdx * 100}%)`;
    }
  </script>
</body>
</html>
