<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio - Juan David Castellanos Moreno</title>
  
  <style>
    /* CSS Puro sin dependencias externas */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111111;
      
      /* FUENTE EXACTA DE ESTA INTERFAZ (Estilo Sistema Moderno) */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Estructura del Carrusel */
    .carousel-viewport {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .carousel-stage {
      width: 100%;
      height: 100%;
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .slide {
      min-width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Control de las imágenes locales de tu CV */
    .slide img {
      height: 100%;
      width: 100%;
      object-fit: contain;
      background-color: #1a1a1a;
    }

    /* Caja de texto inferior centrado */
    .caption-box {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 700px;
      background: rgba(17, 17, 17, 0.85);
      padding: 18px 25px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .caption-box h5 {
      margin: 0;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600; /* Peso semibold idéntico al chat */
      letter-spacing: 0.5px;
    }

    .caption-box p {
      margin: 6px 0 0 0;
      color: #a0a0a0; /* Tu firma en el tono grisáceo solicitado */
      font-size: 13px;
      font-weight: 400;
    }

    /* Botones de navegación discretos */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 15px 20px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    .nav-btn:hover { 
      background: rgba(255,255,255,0.2); 
      color: #ffffff;
    }
    .prev { left: 20px; }
    .next { right: 20px; }
  </style>
</head>
<body>

  <div class="carousel-viewport">
    <div class="carousel-stage" id="stage">
      
      <!-- SLIDE 1 -->
      <div class="slide">
        <img src="pagina1.png" alt="Perfil Profesional">
        <div class="caption-box">
          <h5>Perfil Profesional</h5>
          <p>Juan David Castellanos Moreno — Comunicación Gráfica Publicitaria</p>
        </div>
      </div>

      <!-- SLIDE 2 -->
      <div class="slide">
        <img src="pagina2.png" alt="Experiencia y Proyectos">
        <div class="caption-box">
          <h5>Experiencia & Proyectos</h5>
          <p>Trayectoria en agencias, desarrollo de marcas y maquetación visual.</p>
        </div>
      </div>

    </div>

    <!-- Controles nativos -->
    <button class="nav-btn prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="nav-btn next" onclick="moveSlide(1)">&#10095;</button>
  </div>

  <script>
    let currentIdx = 0;
    const stage = document.getElementById('stage');
    const totalSlides = 2;

    function moveSlide(direction) {
      currentIdx = (currentIdx + direction + totalSlides) % totalSlides;
      stage.style.transform = `translateX(-${currentIdx * 100}%)`;
    }
  </script>
</body>
</html>
